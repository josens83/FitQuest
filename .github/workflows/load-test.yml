name: Load Testing

on:
  # Run on demand
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - load
          - stress
          - spike
          - all
      target_url:
        description: 'Target URL (staging/production)'
        required: true
        default: 'https://api-staging.fitquest.app'
        type: string
      duration:
        description: 'Test duration (e.g., 1m, 5m, 10m)'
        required: false
        default: '1m'
        type: string

  # Run after successful deployment to staging
  workflow_run:
    workflows: ["Deploy"]
    types:
      - completed
    branches:
      - develop

  # Scheduled performance regression check (weekly)
  schedule:
    - cron: '0 2 * * 1' # Every Monday at 2 AM UTC

env:
  K6_VERSION: '0.47.0'

jobs:
  load-test:
    name: K6 Load Test
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          curl -sSL https://github.com/grafana/k6/releases/download/v${{ env.K6_VERSION }}/k6-v${{ env.K6_VERSION }}-linux-amd64.tar.gz | tar xz
          sudo mv k6-v${{ env.K6_VERSION }}-linux-amd64/k6 /usr/local/bin/

      - name: Set test parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "test_type=${{ github.event.inputs.test_type }}" >> $GITHUB_OUTPUT
            echo "target_url=${{ github.event.inputs.target_url }}" >> $GITHUB_OUTPUT
            echo "duration=${{ github.event.inputs.duration }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "schedule" ]; then
            echo "test_type=load" >> $GITHUB_OUTPUT
            echo "target_url=https://api-staging.fitquest.app" >> $GITHUB_OUTPUT
            echo "duration=5m" >> $GITHUB_OUTPUT
          else
            echo "test_type=smoke" >> $GITHUB_OUTPUT
            echo "target_url=https://api-staging.fitquest.app" >> $GITHUB_OUTPUT
            echo "duration=1m" >> $GITHUB_OUTPUT
          fi

      - name: Run Smoke Test
        if: steps.params.outputs.test_type == 'smoke' || steps.params.outputs.test_type == 'all'
        run: |
          k6 run \
            --env BASE_URL=${{ steps.params.outputs.target_url }} \
            --env DURATION=${{ steps.params.outputs.duration }} \
            --out json=results/smoke-test.json \
            tests/load/smoke-test.js
        continue-on-error: true

      - name: Run Load Test
        if: steps.params.outputs.test_type == 'load' || steps.params.outputs.test_type == 'all'
        run: |
          k6 run \
            --env BASE_URL=${{ steps.params.outputs.target_url }} \
            --env DURATION=${{ steps.params.outputs.duration }} \
            --out json=results/load-test.json \
            tests/load/load-test.js
        continue-on-error: true

      - name: Run Stress Test
        if: steps.params.outputs.test_type == 'stress' || steps.params.outputs.test_type == 'all'
        run: |
          k6 run \
            --env BASE_URL=${{ steps.params.outputs.target_url }} \
            --env DURATION=${{ steps.params.outputs.duration }} \
            --out json=results/stress-test.json \
            tests/load/stress-test.js
        continue-on-error: true

      - name: Run Spike Test
        if: steps.params.outputs.test_type == 'spike' || steps.params.outputs.test_type == 'all'
        run: |
          k6 run \
            --env BASE_URL=${{ steps.params.outputs.target_url }} \
            --env DURATION=${{ steps.params.outputs.duration }} \
            --out json=results/spike-test.json \
            tests/load/spike-test.js
        continue-on-error: true

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-results
          path: results/
          retention-days: 30

      - name: Analyze Results
        id: analyze
        run: |
          mkdir -p results

          # Parse results and check thresholds
          check_threshold() {
            local file=$1
            local test_name=$2

            if [ -f "$file" ]; then
              # Extract key metrics
              p95=$(jq -r '.metrics.http_req_duration.values.p95 // 0' "$file" 2>/dev/null || echo "0")
              error_rate=$(jq -r '.metrics.http_req_failed.values.rate // 0' "$file" 2>/dev/null || echo "0")

              echo "## $test_name Results" >> $GITHUB_STEP_SUMMARY
              echo "- P95 Response Time: ${p95}ms" >> $GITHUB_STEP_SUMMARY
              echo "- Error Rate: ${error_rate}%" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY

              # Check if p95 exceeds 2000ms or error rate exceeds 5%
              if (( $(echo "$p95 > 2000" | bc -l) )) || (( $(echo "$error_rate > 0.05" | bc -l) )); then
                echo "performance_issue=true" >> $GITHUB_OUTPUT
              fi
            fi
          }

          echo "# Load Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          for f in results/*.json; do
            if [ -f "$f" ]; then
              test_name=$(basename "$f" .json)
              check_threshold "$f" "$test_name"
            fi
          done

      - name: Create Issue on Performance Degradation
        if: steps.analyze.outputs.performance_issue == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Performance Degradation Detected - ${new Date().toISOString().split('T')[0]}`;
            const body = `## Performance Alert

            The load test has detected performance issues that exceed acceptable thresholds:
            - P95 Response Time > 2000ms OR
            - Error Rate > 5%

            **Test Type:** ${{ steps.params.outputs.test_type }}
            **Target URL:** ${{ steps.params.outputs.target_url }}
            **Run:** [View Details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            Please investigate and address the performance issues.

            /cc @fitquest/backend-team`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['performance', 'automated']
            });

      - name: Send Slack Notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
          text: |
            Load Test Results:
            - Test Type: ${{ steps.params.outputs.test_type }}
            - Target: ${{ steps.params.outputs.target_url }}
            - Status: ${{ job.status }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

  benchmark-comparison:
    name: Benchmark Comparison
    runs-on: ubuntu-latest
    needs: load-test
    if: github.event_name == 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Current Results
        uses: actions/download-artifact@v4
        with:
          name: k6-results
          path: current-results/

      - name: Download Previous Results
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: load-test.yml
          workflow_conclusion: success
          name: k6-results
          path: previous-results/
          search_artifacts: true
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Compare Results
        run: |
          echo "# Weekly Performance Comparison" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -d "previous-results" ] && [ -d "current-results" ]; then
            for f in current-results/*.json; do
              if [ -f "$f" ]; then
                test_name=$(basename "$f" .json)
                prev_file="previous-results/${test_name}.json"

                if [ -f "$prev_file" ]; then
                  curr_p95=$(jq -r '.metrics.http_req_duration.values.p95 // 0' "$f" 2>/dev/null || echo "0")
                  prev_p95=$(jq -r '.metrics.http_req_duration.values.p95 // 0' "$prev_file" 2>/dev/null || echo "0")

                  if [ "$prev_p95" != "0" ]; then
                    diff=$(echo "scale=2; (($curr_p95 - $prev_p95) / $prev_p95) * 100" | bc)
                    echo "## $test_name" >> $GITHUB_STEP_SUMMARY
                    echo "- Previous P95: ${prev_p95}ms" >> $GITHUB_STEP_SUMMARY
                    echo "- Current P95: ${curr_p95}ms" >> $GITHUB_STEP_SUMMARY
                    echo "- Change: ${diff}%" >> $GITHUB_STEP_SUMMARY
                    echo "" >> $GITHUB_STEP_SUMMARY
                  fi
                fi
              fi
            done
          else
            echo "No previous results available for comparison." >> $GITHUB_STEP_SUMMARY
          fi

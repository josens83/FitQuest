apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fitquest-database-credentials
  namespace: fitquest
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: database-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .database }}"
  data:
    - secretKey: username
      remoteRef:
        key: fitquest/database
        property: username
    - secretKey: password
      remoteRef:
        key: fitquest/database
        property: password
    - secretKey: host
      remoteRef:
        key: fitquest/database
        property: host
    - secretKey: port
      remoteRef:
        key: fitquest/database
        property: port
    - secretKey: database
      remoteRef:
        key: fitquest/database
        property: database
---

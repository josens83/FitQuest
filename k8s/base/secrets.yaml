# NOTE: This is a template. In production, use:
# - Kubernetes Secrets with encryption at rest
# - External Secrets Operator with AWS Secrets Manager
# - Sealed Secrets for GitOps
# - HashiCorp Vault

apiVersion: v1
kind: Secret
metadata:
  name: fitquest-secrets
  namespace: fitquest
  labels:
    app.kubernetes.io/name: fitquest
type: Opaque
stringData:
  # Database (replace with actual values)
  DATABASE_URL: "postgresql://fitquest:CHANGE_ME@postgres-service:5432/fitquest?schema=public"
  DATABASE_USER: "fitquest"
  DATABASE_PASSWORD: "CHANGE_ME"

  # Redis
  REDIS_URL: "redis://redis-service:6379"
  REDIS_PASSWORD: ""

  # JWT
  JWT_SECRET: "CHANGE_ME_TO_SECURE_RANDOM_STRING"
  JWT_REFRESH_SECRET: "CHANGE_ME_TO_ANOTHER_SECURE_STRING"

  # Supabase
  SUPABASE_URL: "https://your-project.supabase.co"
  SUPABASE_ANON_KEY: "CHANGE_ME"
  SUPABASE_SERVICE_KEY: "CHANGE_ME"

  # OpenAI (AI Coach)
  OPENAI_API_KEY: "CHANGE_ME"

  # Stripe (Payments)
  STRIPE_SECRET_KEY: "CHANGE_ME"
  STRIPE_WEBHOOK_SECRET: "CHANGE_ME"

  # Sentry (Error Tracking)
  SENTRY_DSN: "CHANGE_ME"

  # External Services
  SENDGRID_API_KEY: "CHANGE_ME"

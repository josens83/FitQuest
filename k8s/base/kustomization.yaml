apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fitquest

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - api-deployment.yaml
  - web-deployment.yaml
  - postgres-statefulset.yaml
  - redis-deployment.yaml
  - ingress.yaml
  - hpa.yaml
  - network-policy.yaml
  - rbac.yaml
  - pdb.yaml

commonLabels:
  app.kubernetes.io/name: fitquest
  app.kubernetes.io/version: "1.0.0"
  app.kubernetes.io/managed-by: kustomize
